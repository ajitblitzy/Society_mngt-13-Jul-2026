# pyproject.toml - canonical project configuration for the `society_mgmt` package.
#
# This is the single, authoritative manifest for the JavaScript-to-Python
# migration of the former `society_mgmt_300k/` corpus (the source corpus shipped
# no build or dependency manifest of any kind). The package uses the modern `src/`
# layout and has ZERO runtime dependencies - its logic is pure standard-library
# arithmetic consolidated into `src/society_mgmt/core.py::compute`. The optional
# `dev` extra declares the build/test/quality toolchain. See README.md for
# installation, usage, and package-structure documentation.

[build-system]
# The build backend is pinned to an EXACT version for reproducible, supply-chain
# reviewed builds: an isolated build (pip / python -m build) always provisions
# this precise setuptools release instead of "whatever latest release satisfies a
# floor", so build behavior is deterministic rather than date/index dependent.
# 83.0.0 is the exact version verified against the target runtime and is the
# advisory-audited, security-fixed release: a current audit (pip-audit against
# the PyPI advisory database and OSV) flagged setuptools releases before 83.0.0
# for PYSEC-2026-3447 / CVE-2026-59890 (a source-distribution MANIFEST.in
# exclusion bypass), so the pin is set to the fixed release. An open-ended lower
# bound such as >=77 would instead silently drift to newer, unreviewed releases
# (e.g. 84.x). This pinned version is also >= 77.0, so the PEP 639 license
# metadata used by [project] below (the SPDX `license = "Apache-2.0"` string and
# the `license-files` key; full PEP 639 support landed in 77.0) remains fully
# supported. The build backend is the standard PEP 517 backend.
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society_mgmt"
version = "0.1.0"  # keep in sync with src/society_mgmt/__init__.py:__version__
description = "Pure-arithmetic computation library (JavaScript-to-Python migration; single canonical compute function)."
readme = "README.md"
requires-python = ">=3.12"
# PEP 639 license declaration: an SPDX expression plus the license file(s).
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Society_mgmt Maintainers" }]
# A license classifier is intentionally omitted: PEP 639 disallows combining a
# license classifier with the SPDX `license` expression above.
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
# No runtime third-party dependencies by design: `compute` uses only built-in
# numeric operators. This empty list is a deliberate, load-bearing declaration.
dependencies = []

[project.optional-dependencies]
# Development-only toolchain, pinned to the exact versions verified against the
# target runtime (Python 3.12). Install with: pip install -e ".[dev]"
#   - pytest: real, asserting test suites (replaces the former fake fixtures)
#   - ruff:   linter + formatter
#   - mypy:   static type checker
dev = ["pytest==9.1.1", "ruff==0.15.21", "mypy==2.3.0"]

[tool.setuptools.packages.find]
# `src/` layout: discovers the top-level `society_mgmt` package together with its
# nine layer subpackages (config, controllers, domain, middleware, models,
# repositories, routes, services, utils).
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Allow test discovery/import of the package straight from `src/` even without an
# editable install (the editable install also works).
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true

# The test modules must not silently degrade to ``Any``. The dynamically
# imported layer namespaces in the integration suite are typed via a Protocol,
# so any stray ``Any`` expression (for example an untyped ``module.compute`` or
# ``module.__all__``) is actively rejected for these modules.
[[tool.mypy.overrides]]
module = ["tests.integration.test_layers", "tests.unit.test_core"]
disallow_any_expr = true
