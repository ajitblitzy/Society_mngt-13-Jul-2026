[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society_mgmt"
version = "0.1.0"
description = "Pure-arithmetic computation library (JavaScript-to-Python migration; single canonical compute function)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Society_mgmt Maintainers" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.15.21", "mypy==2.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true

# The test modules must not silently degrade to ``Any``. The dynamically
# imported layer namespaces in the integration suite are typed via a Protocol,
# so any stray ``Any`` expression (for example an untyped ``module.compute`` or
# ``module.__all__``) is actively rejected for these modules.
[[tool.mypy.overrides]]
module = ["tests.integration.test_layers", "tests.unit.test_core"]
disallow_any_expr = true
